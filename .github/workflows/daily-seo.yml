name: Daily SEO Optimizer

on:
  schedule:
    # Runs daily at 22:00 UTC = 06:00 AM WITA (Bali time)
    - cron: '0 22 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  seo-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO optimizer
        id: seo
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_CLIENT_EMAIL: ${{ secrets.GA_CLIENT_EMAIL }}
          GA_PRIVATE_KEY: ${{ secrets.GA_PRIVATE_KEY }}
        run: node scripts/daily-seo.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "has_changes=false" >> $GITHUB_OUTPUT || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Install dependencies & verify build
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "SEO Bot"
          git config user.email "seo-bot@shisha.cool"
          git add -A
          DATE=$(date +%Y-%m-%d)
          git commit -m "chore(seo): daily optimization — $DATE

          Automated SEO improvements applied by daily-seo pipeline.
          See scripts/seo-reports/$DATE.md for details."
          git push

      - name: No changes
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "✅ No SEO changes needed today"
